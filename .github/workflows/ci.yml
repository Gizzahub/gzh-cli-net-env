name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache: true
      - name: Verify Go version
        run: |
          expected='go1.26.7'
          actual="$(go version | awk '{print $3}')"
          if [ "$actual" != "$expected" ]; then
            echo "Expected Go $expected, got $actual" >&2
            exit 1
          fi
      - name: Test
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Verify Go version
        run: |
          expected='go1.26.7'
          actual="$(go version | awk '{print $3}')"
          if [ "$actual" != "$expected" ]; then
            echo "Expected Go $expected, got $actual" >&2
            exit 1
          fi
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1

  vulncheck:
    name: Vulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
      - name: Verify Go version
        run: |
          expected='go1.26.7'
          actual="$(go version | awk '{print $3}')"
          if [ "$actual" != "$expected" ]; then
            echo "Expected Go $expected, got $actual" >&2
            exit 1
          fi
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
